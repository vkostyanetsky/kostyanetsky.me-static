    <script>
      const projects = [
        
        {
          title: "RFQ Service",
          description: "A web application for a trading company, needed for estimating orders from suppliers.",
          image: "https://kostyanetsky.me/projects/rfq-service/thumbnail.png",
          
          chips: [
            
            {
              key: "typescript",
              title: "TypeScript",
              known: true,
            },
            
            {
              key: "nodejs",
              title: "Node.js",
              known: true,
            },
            
            {
              key: "react",
              title: "React",
              known: true,
            },
            
            {
              key: "python",
              title: "Python",
              known: true,
            },
            
            {
              key: "flask",
              title: "Flask",
              known: true,
            },
            
            {
              key: "1c-v8",
              title: "1\u0421:Enterprise",
              known: true,
            },
            
            {
              key: "fb-erp",
              title: "FirstBit ERP",
              known: true,
            },
            
          ],
          href: "rfq-service",
        },
        
      ];

      // A stack of a pre-generated list (projects/stacks/<stack>), empty for
      // a common one.

      const pageStack = "python";
      const projectsListUrl = "https://kostyanetsky.me/projects/";

  const cardsEl = document.getElementById("cards");
  const countEl = document.getElementById("count");
  const emptyEl = document.getElementById("empty");
  const searchEl = document.getElementById("search");

  const btnGrid = document.getElementById("btnGrid");
  const btnList = document.getElementById("btnList");

  let mode = "grid";
  let chip = pageStack || "all";
  let searchTimer;

  function scheduleSearch() {
    clearTimeout(searchTimer);
    searchEl.setAttribute("aria-busy", "true");
    searchTimer = setTimeout(() => {
      try {
        render();
      } finally {
        searchEl.setAttribute("aria-busy", "false");
      }
    }, 200);
  }

  // ------------------------------------------------------------
  // Session state:
  // - persists on F5 / reload
  // - cleared when tab/browser is closed
  // ------------------------------------------------------------
  const STATE_KEY = "projects_ui_state_v1";

  function saveState() {
    try {
      sessionStorage.setItem(STATE_KEY, JSON.stringify({ mode, chip }));
    } catch (_) {}
  }

  function loadState() {
    try {
      const raw = sessionStorage.getItem(STATE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (_) {
      return null;
    }
  }

  function escapeHtml(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function escapeAttr(str) {
    return escapeHtml(str).replaceAll("\n", " ");
  }

  const BADGE_CLASS =
    "inline-flex items-center rounded-full border border-slate-200 bg-slate-50 px-2.5 py-1 text-xs text-slate-700";
  const BADGE_CLASS_CLICKABLE =
    BADGE_CLASS + " cursor-pointer transition hover:bg-slate-100";

  const badge = (chipData) =>
    chipData.known
      ? `
    <button type="button" data-chip="${escapeAttr(chipData.key)}" class="${BADGE_CLASS_CLICKABLE}">
      ${escapeHtml(chipData.title)}
    </button>
  `
      : `
    <span class="${BADGE_CLASS}">
      ${escapeHtml(chipData.title)}
    </span>
  `;

  function applyMode(nextMode) {
    mode = nextMode;

    if (mode === "grid") {
      btnGrid.className =
        "rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-800 transition hover:bg-slate-100";
      btnList.className =
        "rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700 transition hover:bg-slate-50";
      btnGrid.setAttribute("aria-pressed", "true");
      btnList.setAttribute("aria-pressed", "false");
    } else {
      btnList.className =
        "rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-800 transition hover:bg-slate-100";
      btnGrid.className =
        "rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700 transition hover:bg-slate-50";
      btnList.setAttribute("aria-pressed", "true");
      btnGrid.setAttribute("aria-pressed", "false");
    }
  }

  const CHIP_CLASS_DEFAULT =
    "chip rounded-full border border-slate-200 bg-white px-3 py-1.5 text-xs text-slate-700 cursor-pointer hover:bg-slate-50";
  const CHIP_CLASS_ACTIVE =
    "chip rounded-full border border-slate-200 bg-slate-100 px-3 py-1.5 text-xs text-slate-900 cursor-pointer hover:bg-slate-200";

  function applyChip(nextChip) {
    chip = nextChip;

    document.querySelectorAll(".chip").forEach((x) => {
      x.className = CHIP_CLASS_DEFAULT;
    });

    const active = document.querySelector(`.chip[data-chip="${CSS.escape(chip)}"]`);

    if (active) {
      active.className = CHIP_CLASS_ACTIVE;
    } else {
      chip = "all";
      const allBtn = document.querySelector(`.chip[data-chip="all"]`);
      if (allBtn) {
        allBtn.className = CHIP_CLASS_ACTIVE;
      }
    }
  }

  function card(project) {
    const stacksHtml = (project.chips || []).map(badge).join("");

    const body = `
      <div class="flex flex-col gap-3 p-4">
        <div class="flex items-start justify-between gap-3">
          <a href="https://kostyanetsky.me/projects/${project.href}" class="inline text-2xl font-semibold tracking-tight hover:underline">
            <h3 class="text-lg font-semibold leading-snug tracking-tight">${escapeHtml(project.title)}</h3>
          </a>
        </div>

        <p class="text-sm text-slate-700 ${mode === "grid" ? "line-clamp-3" : "line-clamp-2"}">
          ${escapeHtml(project.description)}
        </p>

        <div class="flex flex-wrap gap-2">${stacksHtml}</div>
      </div>
    `;

    if (mode === "list") {
      return `
        <article class="group overflow-hidden rounded-2xl border border-slate-200 bg-white transition hover:bg-slate-50">
          <div class="flex flex-col md:flex-row">
            <div class="md:w-[320px]">
              <img
                src="${project.image}"
                alt="${escapeAttr(project.title)}"
                class="h-48 w-full object-cover md:h-full"
                loading="lazy"
              />
            </div>
            <div class="flex-1">${body}</div>
          </div>
        </article>
      `;
    }

    return `
      <article class="group overflow-hidden rounded-2xl border border-slate-200 bg-white transition hover:bg-slate-50">
        <img
          src="${project.image}"
          alt="${escapeAttr(project.title)}"
          class="h-44 w-full object-cover"
          loading="lazy"
        />
        ${body}
      </article>
    `;
  }

  function render() {
    const q = (searchEl.value || "").trim().toLowerCase();

    const filtered = projects.filter((p) => {
      const chips = p.chips || [];
      const matchesChip = chip === "all" ? true : chips.some((c) => c.key === chip);
      const haystack = `${p.title} ${p.description} ${chips.map((c) => c.title).join(" ")}`.toLowerCase();
      return matchesChip && (q ? haystack.includes(q) : true);
    });

    countEl.textContent = String(filtered.length);

    if (filtered.length === 0) {
      cardsEl.innerHTML = "";
      emptyEl.classList.remove("hidden");
      return;
    }

    emptyEl.classList.add("hidden");

    cardsEl.className =
      mode === "grid"
        ? "mt-8 grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3"
        : "mt-8 grid grid-cols-1 gap-4";

    cardsEl.innerHTML = filtered.map(card).join("");
  }

  // -----------------------
  // Events
  // -----------------------
  btnGrid.addEventListener("click", () => {
    applyMode("grid");
    saveState();
    render();
  });

  btnList.addEventListener("click", () => {
    applyMode("list");
    saveState();
    render();
  });

  searchEl.addEventListener("input", scheduleSearch);

  // A delegated handler, since stack chips of a project card are rendered
  // dynamically as well: both the chips above and the ones of a card filter
  // the list.

  document.addEventListener("click", (event) => {
    const clickedChip = event.target.closest("[data-chip]");

    if (!clickedChip) return;

    const nextChip = clickedChip.dataset.chip || "all";

    // Projects of a pre-generated list are filtered by its stack, so dropping
    // the stack means leaving the page for the common list.

    if (pageStack && nextChip === "all") {
      chip = "all";
      saveState();
      window.location.href = projectsListUrl;
      return;
    }

    applyChip(nextChip);
    saveState();
    render();
  });

  // -----------------------
  // Init (restore state, then render)
  // -----------------------
  const st = loadState();

  if (st?.mode === "grid" || st?.mode === "list") applyMode(st.mode);
  else applyMode("grid");

  // A pre-generated list is filtered by its own stack, so a saved one has to
  // be ignored: an URL wins over a state of a previously visited page.

  if (pageStack) applyChip(pageStack);
  else if (typeof st?.chip === "string") applyChip(st.chip);
  else applyChip("all");

  render();
    </script>
